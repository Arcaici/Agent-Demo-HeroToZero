server {
    listen 80;

    location /api/ {
        proxy_pass http://demo-5-prompt-injection-api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 200s;
        proxy_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
