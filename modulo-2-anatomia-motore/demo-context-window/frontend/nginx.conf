server {
    listen 80;

    location /api/ {
        proxy_pass http://demo-2-context-window-api:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
